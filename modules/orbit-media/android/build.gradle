plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'expo.modules.orbitmedia'
version = '0.1.0'
android {
  namespace "expo.modules.orbitmedia"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  implementation "androidx.webkit:webkit:1.18.0"
  testImplementation "junit:junit:4.13.2"
}
